name: build-check

on:
  pull_request:
  push:
    branches: [main]

# A full APK build cannot run here because it depends on artifacts that
# cannot be redistributed (sts2.dll, custom Godot fork, FMOD). What we *can*
# do in CI: format check, shell lint, native stubs build.

jobs:
  csharpier:
    name: csharpier --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve .NET TFM from csproj
        id: tfm
        run: |
          TFM=$(grep -oE "<TargetFramework>[^<]+</TargetFramework>" \
                src/STS2Mobile/STS2Mobile.csproj \
                | sed -E 's#</?TargetFramework>##g' | head -1)
          MAJOR=$(printf '%s' "$TFM" | sed -E 's/^net([0-9]+).*/\1/')
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Using .NET ${MAJOR}.x for $TFM"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.tfm.outputs.major }}.0.x

      - name: Install csharpier
        run: dotnet tool install -g csharpier

      - name: Check formatting
        run: csharpier check src/STS2Mobile

  tests:
    name: unit tests (pure C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve .NET TFM from csproj
        id: tfm
        run: |
          TFM=$(grep -oE "<TargetFramework>[^<]+</TargetFramework>" \
                src/STS2Mobile/STS2Mobile.csproj \
                | sed -E 's#</?TargetFramework>##g' | head -1)
          MAJOR=$(printf '%s' "$TFM" | sed -E 's/^net([0-9]+).*/\1/')
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.tfm.outputs.major }}.0.x

      - name: dotnet test
        run: dotnet test src/STS2Mobile.Tests/STS2Mobile.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  shellcheck:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: bash -n syntax check
        run: |
          set -e
          for f in scripts/*.sh src/stubs/*.sh; do
            echo "syntax: $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: shellcheck scripts/*.sh src/stubs/*.sh

  native-stubs:
    name: native stubs (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve NDK version from android/config.gradle
        id: ndk
        run: |
          NDK_VERSION=$(grep -oE "ndkVersion[[:space:]]*:[[:space:]]*'[0-9.]+'" \
                        android/config.gradle \
                        | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          if [ -z "$NDK_VERSION" ]; then
            echo "ERROR: could not parse ndkVersion from android/config.gradle" >&2
            exit 1
          fi
          echo "version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "NDK version: $NDK_VERSION"

      - name: Install NDK ${{ steps.ndk.outputs.version }}
        run: |
          set -euo pipefail
          # GitHub-hosted ubuntu runners ship the Android SDK at this path
          # but do not put cmdline-tools on PATH. Resolve sdkmanager
          # directly and accept licenses before installing.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Falling back to first cmdline-tools dir under $SDK" >&2
            SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -executable | head -1)
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK" >&2
            ls -la "$SDK" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;${{ steps.ndk.outputs.version }}" >/dev/null
          echo "ANDROID_SDK_ROOT=$SDK"
          ls "$SDK/ndk/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Build native stubs
        run: bash src/stubs/build_stubs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native-stubs-arm64-v8a
          path: src/stubs/out/arm64-v8a/
          if-no-files-found: error
